name: Bootstrap recoverable App Shelf source checkpoint

on:
  push:
    branches:
      - feat/complete-app-shelf-v1
    paths:
      - '.bootstrap/core.part*'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack-and-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/core.part* | base64 --decode > /tmp/appshelf-core.tar.gz
          echo 'a33f02f88ce1d95f4ccf8e1b4ad626e934e0155ff5d8f3db5d1c4a7c6e325c53  /tmp/appshelf-core.tar.gz' | sha256sum -c -
          tar -xzf /tmp/appshelf-core.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Validate restored implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q helper tests
          python -m unittest discover -s tests -v

      - name: Commit durable source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'App Shelf checkpoint bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No restored changes to commit.'
            exit 0
          fi
          git commit -m 'feat(core): implement safe App Shelf runtime and providers'
          git push origin HEAD:${GITHUB_REF_NAME}
